<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lateral Inhibition Lab</title>
<!--
  Reference "predict, then drag" simulation for /study. Copy, then edit only the
  SIM object at the bottom: question, options, answer, model(), explain(), followups.
  Contract: the sliders stay locked until a prediction is chosen; the reveal compares
  the prediction to what the model shows; retrieval questions close the page.
-->
<style>
:root{--bg:#ffffff;--surface:#f4f1ee;--ink:#1f1a17;--muted:#6b5f55;--line:#e3ddd7;--accent:#c2410c;--blue:#1e3a5f;--good:#3f7d3a;--bad:#b42318;--barA:#c2410c;--barB:#8a7a6c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1714;--surface:#26201c;--ink:#f3ece4;--muted:#a89a8c;--line:#3a312b;--accent:#e8833a;--blue:#8db8e0;--good:#93c47d;--bad:#e06666;--barA:#e8833a;--barB:#6b5a4c}}
:root[data-theme="dark"]{--bg:#1c1714;--surface:#26201c;--ink:#f3ece4;--muted:#a89a8c;--line:#3a312b;--accent:#e8833a;--blue:#8db8e0;--good:#93c47d;--bad:#e06666;--barA:#e8833a;--barB:#6b5a4c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:40px 16px 72px}
h1{font-size:30px;margin:0 0 6px}.sub{color:var(--muted);margin:0 0 24px}
h2{font-size:19px;margin:28px 0 10px}
.step{background:var(--surface);border-radius:10px;padding:20px 22px;margin-bottom:16px}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer}
.opt:hover{border-color:var(--accent)}.opt.sel{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.locked{opacity:.45;pointer-events:none;filter:grayscale(.5)}
.ctrl{display:grid;grid-template-columns:220px 1fr 70px;align-items:center;gap:14px;margin:8px 0}
.ctrl label{font-weight:600}.ctrl output{font-variant-numeric:tabular-nums;text-align:right;color:var(--accent);font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent)}
svg{width:100%;height:auto;display:block}
.reveal{border-left:4px solid var(--accent);padding:12px 16px;background:var(--bg);border-radius:0 8px 8px 0;margin-top:14px;display:none}
.reveal.on{display:block}.ok{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}
.btn{font:inherit;font-weight:600;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 16px;cursor:pointer;margin-top:12px}
details{border-top:1px solid var(--line);padding:10px 0}summary{cursor:pointer;font-weight:600}details p{margin:8px 0 0;color:var(--muted)}
.hint{font-size:14px;color:var(--muted)}
</style></head><body><main>
<h1 id="title"></h1><p class="sub" id="subtitle"></p>

<div class="step"><h2 style="margin-top:0">1. Predict first</h2><p id="question"></p><div class="opts" id="opts"></div>
<p class="hint" id="lockhint">The sliders unlock after you commit to an answer.</p></div>

<div class="step locked" id="lab"><h2 style="margin-top:0">2. Now drag</h2><div id="controls"></div><div id="plot"></div><p class="hint" id="readout"></p>
<button class="btn" id="check">Check my prediction</button><div class="reveal" id="reveal"></div></div>

<div class="step"><h2 style="margin-top:0">3. Retrieval check</h2><p class="hint">Answer out loud or on paper before you open each one.</p><div id="follow"></div></div>
</main>
<script>
const SIM = {
  title: "Lateral inhibition lab",
  subtitle: "Example: Vision chapter, retina. Twelve receptors sit across a light edge; horizontal cells subtract a share of each neighbor's input.",
  question: "Turn the inhibition strength UP. What happens to the bright cell right at the edge, compared with the bright cells deeper in?",
  options: ["It stays the same as the others", "It ends up higher than the others, and the gap grows", "It ends up lower than the others"],
  answer: 1,
  controls: [
    {id: "k", label: "Inhibition strength", min: 0, max: 0.15, step: 0.01, value: 0.1},
    {id: "bright", label: "Bright side light", min: 4, max: 10, step: 1, value: 10}
  ],
  model(p) {  // returns {inputs, outputs}
    const inp = Array.from({length: 12}, (_, i) => i < 6 ? p.bright : 2);
    const out = inp.map((v, i) => {
      const l = inp[Math.max(0, i - 1)], r = inp[Math.min(11, i + 1)];
      return Math.max(0, v - p.k * (l + r));  // firing rate cannot go below 0
    });
    return {inputs: inp, outputs: out};
  },
  readout(p, m) {
    const o = m.outputs;
    return `Bright interior ${o[2].toFixed(1)}, bright edge ${o[5].toFixed(1)}, dark edge ${o[6].toFixed(1)}, dark interior ${o[9].toFixed(1)}. Edge overshoot: ${(o[5] - o[2]).toFixed(1)} up, ${(o[9] - o[6]).toFixed(1)} down.`;
  },
  explain: "The bright edge cell has one dim neighbor, so it is inhibited less than bright cells surrounded by bright cells. The dark edge cell has one bright neighbor, so it is inhibited more. Stronger inhibition widens both gaps: the border gets exaggerated. That is the slide 24 line, lateral inhibition sharpens contrast at the borders of objects. At strength 0 the overshoot disappears, which is the control case.",
  followups: [
    ["Which retinal cells make lateral inhibition, and onto which cells?", "Horizontal cells, inhibiting bipolar cells (slide 22)."],
    ["At inhibition strength 0, what does the edge look like in the output?", "Exactly like the input: no overshoot, so no contrast enhancement."],
    ["Why do the white crossroads of the Hermann grid look gray?", "A crossroad has white on four sides, so it gets more inhibition than a street with white on only two sides."]
  ]
};

const $ = id => document.getElementById(id);
let choice = null; const P = {};
$("title").textContent = SIM.title; $("subtitle").textContent = SIM.subtitle; $("question").textContent = SIM.question;
SIM.options.forEach((t, i) => { const b = document.createElement("button"); b.className = "opt"; b.textContent = t;
  b.onclick = () => { choice = i; document.querySelectorAll(".opt").forEach(x => x.classList.remove("sel")); b.classList.add("sel");
    $("lab").classList.remove("locked"); $("lockhint").textContent = "Locked in. Now test it."; }; $("opts").appendChild(b); });
SIM.controls.forEach(c => { P[c.id] = c.value; const row = document.createElement("div"); row.className = "ctrl";
  row.innerHTML = `<label for="${c.id}">${c.label}</label><input type="range" id="${c.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${c.value}"><output id="${c.id}_o">${c.value}</output>`;
  $("controls").appendChild(row); row.querySelector("input").oninput = e => { P[c.id] = +e.target.value; $(c.id + "_o").textContent = e.target.value; draw(); }; });
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function draw() {
  const m = SIM.model(P), W = 900, H = 300, base = 250, sc = 20, n = m.outputs.length, bw = W / n;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="input and output bars">`;
  s += `<line x1="0" y1="${base}" x2="${W}" y2="${base}" stroke="${css('--muted')}"/>`;
  s += `<line x1="${W/2}" y1="20" x2="${W/2}" y2="${base+10}" stroke="${css('--muted')}" stroke-dasharray="5 5"/>`;
  s += `<text x="${W/2}" y="${base+30}" fill="${css('--muted')}" font-size="14" text-anchor="middle">edge</text>`;
  m.outputs.forEach((v, i) => { const x = i * bw + bw * 0.18, w = bw * 0.64, h = v * sc;
    s += `<rect x="${x}" y="${base - m.inputs[i] * sc}" width="${w}" height="${m.inputs[i] * sc}" fill="none" stroke="${css('--muted')}" stroke-dasharray="3 3"/>`;
    s += `<rect x="${x}" y="${base - h}" width="${w}" height="${h}" fill="${m.inputs[i] > 2 ? css('--barA') : css('--barB')}" opacity="0.9"/>`;
    s += `<text x="${x + w / 2}" y="${base - h - 6}" fill="${css('--ink')}" font-size="13" font-weight="700" text-anchor="middle">${v.toFixed(1)}</text>`; });
  s += `<text x="8" y="16" fill="${css('--muted')}" font-size="13">dashed outline = light in; filled bar = signal out</text></svg>`;
  $("plot").innerHTML = s; $("readout").textContent = SIM.readout(P, m);
}
$("check").onclick = () => { const r = $("reveal"); r.classList.add("on");
  r.innerHTML = (choice === SIM.answer ? '<span class="ok">Your prediction matched.</span> ' : `<span class="no">Not quite.</span> The answer is "${SIM.options[SIM.answer]}". `) + SIM.explain; };
SIM.followups.forEach(([q, a]) => { const d = document.createElement("details"); d.innerHTML = `<summary>${q}</summary><p>${a}</p>`; $("follow").appendChild(d); });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw); draw();
</script></body></html>
